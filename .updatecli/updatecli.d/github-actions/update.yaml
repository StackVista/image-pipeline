name: Update image-pipeline GitHub Actions pins
pipelineid: image-pipeline-github-actions

# GitHub Actions-specific pipeline. This covers workflow/composite-action
# `uses:` pins and scanner tool versions embedded in the scan-image composite
# action.

scms:
  default:
    kind: "{{ .scm.kind }}"
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"
      commitUsingApi: true
      force: false
      username: "{{ .scm.username }}"
      token: "{{ requiredEnv .scm.tokenEnv }}"
      commitmessage:
        type: chore
        scope: deps

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: "[updatecli] bump GitHub Actions pins"

autodiscovery:
  scmid: default
  actionid: default
  groupby: all
  crawlers:
    # Handles all `uses:` pins in workflows and composite actions
    githubaction:
      spec:
        rootdir: .
        digest: true
        versionfilter:
          kind: semver
          pattern: minor
        files:
          - ".github/workflows/*.yml"
          - ".github/workflows/*.yaml"
          - ".github/actions/*/action.yml"
          - ".github/actions/*/action.yaml"

sources:
  trivyVersion:
    name: Latest Trivy 0 release tag
    kind: gittag
    spec:
      url: "https://github.com/aquasecurity/trivy.git"
      versionfilter:
        kind: regex/semver
        regex: "^v(0\\.[0-9]+\\.[0-9]+)$"
        pattern: "*"

  grypeVersion:
    name: Latest Grype 0 release tag
    kind: gittag
    spec:
      url: "https://github.com/anchore/grype.git"
      versionfilter:
        kind: regex/semver
        regex: "^v(0\\.[0-9]+\\.[0-9]+)$"
        pattern: "*"
    transformers:
      - trimprefix: "v"

  buildxVersion:
    name: Latest Buildx 0 release tag
    kind: gittag
    spec:
      url: "https://github.com/docker/buildx.git"
      versionfilter:
        kind: regex/semver
        regex: "^v(0\\.[0-9]+\\.[0-9]+)$"
        pattern: "*"

targets:
  scanImageScannerPins:
    name: "scan-image: bump scanner versions and checksums"
    kind: shell
    scmid: default
    disablesourceinput: true
    spec:
      command: 'python3 scripts/update-scanner-pins.py {{ source "trivyVersion" }} {{ source "grypeVersion" }}'
      environments:
        - name: PATH
      changedif:
        kind: file/checksum
        spec:
          files:
            - ".github/actions/scan-image/action.yml"
            - ".github/actions/scan-image/scanner-checksums.txt"

  actionsBuildxVersion:
    name: "composite actions: bump pinned Buildx version"
    kind: file
    scmid: default
    sourceid: buildxVersion
    spec:
      files:
        - ".github/actions/push-single-arch/action.yml"
        - ".github/actions/merge-multiarch/action.yml"
      content: '        version: {{ source "buildxVersion" }}'
      matchpattern: '        version: v0\.[0-9]+\.[0-9]+'

  workflowBuildxVersion:
    name: "apply-oci-labels-ci: bump pinned Buildx version"
    kind: file
    scmid: default
    sourceid: buildxVersion
    spec:
      file: ".github/workflows/apply-oci-labels-ci.yml"
      content: '          version: {{ source "buildxVersion" }}'
      matchpattern: '          version: v0\.[0-9]+\.[0-9]+'
