name: merge-multiarch-image
description: merge multi-arch images based on per-arch tags

inputs:
  image:
    description: "Full image name, e.g. ghcr.io/myorg/app"
    required: true
  tag:
    description: The tag component in a fully qualified image.
    required: true
  arches:
    description: Comma-separated architectures to merge, e.g. amd64,arm64
    required: false
    default: "amd64,arm64"
  receipts:
    description: Directory of architecture digest receipts from this workflow run; enables safe resume
    required: false
    default: ""
  target-registry:
    description: "Optional target registry to docker login"
    required: false
    default: ""
  target-registry-user:
    description: "Username for target-registry login. Required when target-registry is set"
    required: false
    default: ""
  target-registry-password:
    description: "Password/token for target-registry login. Required when target-registry is set"
    required: false
    default: ""
outputs:
  digest:
    description: Verified multiarch manifest digest
    value: ${{ steps.publish.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      with:
        version: v0.36.1

    - name: Login to target registry
      if: ${{ inputs.target-registry != '' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.target-registry }}
        username: ${{ inputs.target-registry-user }}
        password: ${{ inputs.target-registry-password }}

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Assemble and verify publication
      id: publish
      shell: bash
      run: python3 "$ACTION_PATH/publish.py"
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUTS_IMAGE: ${{ inputs.image }}
        INPUTS_TAG: ${{ inputs.tag }}
        INPUTS_ARCHES: ${{ inputs.arches }}
        INPUTS_RECEIPTS: ${{ inputs.receipts }}
