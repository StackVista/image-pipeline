name: "apply-oci-labels"
description: "Compute the canonical SUSE Observability OCI label set for a built image. Output is intended to be appended after docker/metadata-action's labels (last-write-wins on duplicate keys)."

inputs:
  image-name:
    description: "Short image name, used in image.ref.name (e.g. victoria-metrics)."
    required: true
  tag:
    description: "Tag the image is published under (e.g. 1.143.0-so1). Used for org.opencontainers.image.version and image.ref.name."
    required: true
  title:
    description: "Value for org.opencontainers.image.title (e.g. 'SUSE Observability VictoriaMetrics')."
    required: true
  description:
    description: "Value for org.opencontainers.image.description. One-line."
    required: true
  component:
    description: "Value for com.suse.observability.component (e.g. receiver, k8s-agent)."
    required: true
  product:
    description: "Value for com.suse.observability.product. Defaults to 'suse-observability'."
    required: false
    default: "suse-observability"
  upstream-name:
    description: "Optional value for org.opencontainers.image.upstream.name (the upstream project name when this image repackages third-party software)."
    required: false
    default: ""
  dockerfile:
    description: "Deprecated no-op. Base image labels are intentionally not emitted by this action."
    required: false
    default: "./Dockerfile"
  base-name:
    description: "Deprecated no-op. Base image labels are intentionally not emitted by this action."
    required: false
    default: ""
  base-digest:
    description: "Deprecated no-op. Base image labels are intentionally not emitted by this action."
    required: false
    default: ""
  documentation-url:
    description: "Value for image.url and image.documentation."
    required: false
    default: "https://documentation.suse.com/cloudnative/suse-observability/latest/en/classic.html"
  registry-credentials:
    description: "Deprecated no-op. Kept for caller compatibility."
    required: false
    default: "[]"

outputs:
  labels:
    description: "Newline-delimited key=value labels. Append after docker/metadata-action's labels output."
    value: ${{ steps.compose.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Validate required inputs
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        DESCRIPTION: ${{ inputs.description }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail
        missing=()
        [ -z "${TITLE}" ]       && missing+=(title)
        [ -z "${DESCRIPTION}" ] && missing+=(description)
        [ -z "${COMPONENT}" ]   && missing+=(component)
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::apply-oci-labels: missing required inputs: ${missing[*]}" >&2
          exit 1
        fi

    - name: Compose label set
      id: compose
      shell: bash
      env:
        IMAGE_NAME:  ${{ inputs.image-name }}
        TAG:         ${{ inputs.tag }}
        TITLE:       ${{ inputs.title }}
        DESCRIPTION: ${{ inputs.description }}
        COMPONENT:   ${{ inputs.component }}
        PRODUCT:     ${{ inputs.product }}
        UPSTREAM:    ${{ inputs.upstream-name }}
        DOC_URL:     ${{ inputs.documentation-url }}
        SERVER_URL:  ${{ github.server_url }}
        REPO:        ${{ github.repository }}
        SHA:         ${{ github.sha }}
        RUN_ID:      ${{ github.run_id }}
      run: |
        set -euo pipefail

        # An explicit empty `product` overrides the input default, so default
        # again here for the common case where the caller forwards an empty
        # value from upstream config (e.g. image.json with no oci_labels.product).
        if [ -z "${PRODUCT}" ]; then
          PRODUCT="suse-observability"
        fi

        ref_name="registry.rancher.com/suse-observability/${IMAGE_NAME}:${TAG}"
        source_url="${SERVER_URL}/${REPO}"
        run_url="${source_url}/actions/runs/${RUN_ID}"
        created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        # Canonical SUSE Observability label set. Base image labels are omitted
        # deliberately: resolving them requires Dockerfile parsing and registry
        # lookups that are brittle enough to block image publication.
        {
          echo 'labels<<__LABELS_EOF__'
          echo "org.opencontainers.image.title=${TITLE}"
          echo "org.opencontainers.image.description=${DESCRIPTION}"
          echo "org.opencontainers.image.version=${TAG}"
          echo "org.opencontainers.image.ref.name=${ref_name}"
          echo "org.opencontainers.image.source=${source_url}"
          echo "org.opencontainers.image.revision=${SHA}"
          echo "org.opencontainers.image.created=${created}"
          echo "org.opencontainers.image.vendor=SUSE LLC"
          echo "org.opencontainers.image.authors=suse-observability-ops@suse.com"
          echo "org.opencontainers.image.url=${DOC_URL}"
          echo "org.opencontainers.image.documentation=${DOC_URL}"
          echo "published-by=${run_url}"
          echo "com.suse.observability.product=${PRODUCT}"
          echo "com.suse.observability.component=${COMPONENT}"
          if [ -n "${UPSTREAM}" ]; then
            echo "org.opencontainers.image.upstream.name=${UPSTREAM}"
          fi
          echo '__LABELS_EOF__'
        } >> "$GITHUB_OUTPUT"
