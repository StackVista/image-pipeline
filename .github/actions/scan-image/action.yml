name: "scan-image"
description: "Scan a published container image and evaluate vulnerabilities"

inputs:
  image:
    description: "Image ref to scan"
    required: true
  exceptions-path:
    description: "Optional path in the caller workspace containing exception YAML files"
    required: false
    default: ""
  mode:
    description: "gate | inform"
    required: false
    default: gate
  severity:
    description: "Comma-separated severities to gate on"
    required: false
    default: HIGH,CRITICAL
  with-grype:
    description: "Also run Grype for vulnerabilities with available fixes"
    required: false
    default: "true"
  skip-files:
    description: |
      Optional newline-separated list of absolute paths inside the image to
      skip during vulnerability scanning. Use for upstream binaries we ship
      but don't audit per-CVE (e.g. /usr/bin/sops, /work/.tfenv/.../terraform).
      Passed to Trivy as --skip-files and to Grype as --exclude. The Trivy
      secrets scan is NOT subject to this list — secret coverage stays
      comprehensive.
    required: false
    default: ""
  upload-sarif:
    description: "Upload SARIF to GHAS Code Scanning"
    required: false
    default: "true"
  sarif-category:
    description: "SARIF category for GHAS filterability"
    required: false
    default: release-gate
  source_registry:
    description: "Optional source registry to docker login to before scanning"
    required: false
    default: ""
  source_registry_user:
    description: "Username for source_registry login. Required when source_registry is set"
    required: false
    default: ""
  source_registry_password:
    description: "Password/token for source_registry login. Required when source_registry is set"
    required: false
    default: ""

outputs:
  decision:
    description: "passed | failed"
    value: ${{ steps.evaluate.outputs.decision }}
  sarif-path:
    description: "Path to the generated SARIF file"
    value: ${{ steps.evaluate.outputs.sarif-path }}

runs:
  using: composite
  steps:
    # Shared assets (evaluator/, vex/, schemas/) live at the repo root,
    # three levels above this action: .github/actions/scan-image/ → repo root.
    # Resolve to an absolute path up front: actions/setup-go's
    # cache-dependency-path runs through @actions/glob, which rejects `..`
    # in patterns. Using realpath sidesteps that and keeps downstream refs tidy.
    - name: Resolve repo root
      id: paths
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GRYPE_VERSION: 0.118.0
      run: |
        trivy_cache="${TRIVY_CACHE_DIR:-${HOME}/.cache/trivy}"
        grype_cache="${GRYPE_DB_CACHE_DIR:-${XDG_CACHE_HOME:-${HOME}/.cache}/grype/db}"
        grype_install_cache="${HOME}/.cache/image-pipeline/grype/${GRYPE_VERSION}/${RUNNER_OS}-${RUNNER_ARCH}"
        grype_db_present=false
        for db in "${grype_cache}"/*/vulnerability.db; do
          if [ -s "${db}" ]; then grype_db_present=true; break; fi
        done
        echo "repo_root=$(realpath "${ACTION_PATH}/../../..")" >> "$GITHUB_OUTPUT"
        echo "grype_version=${GRYPE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "grype_cache=${grype_cache}" >> "$GITHUB_OUTPUT"
        echo "grype_install_cache=${grype_install_cache}" >> "$GITHUB_OUTPUT"
        echo "grype_db_present=${grype_db_present}" >> "$GITHUB_OUTPUT"
        echo "grype_install_present=$([ -s "${grype_install_cache}/grype.tar.gz" ] && [ -s "${grype_install_cache}/checksums.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "trivy_cache=${trivy_cache}" >> "$GITHUB_OUTPUT"
        echo "cache_day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
        echo "java_cache_period=$(( $(date -u +%s) / 259200 ))" >> "$GITHUB_OUTPUT"
        echo "db_present=$([ -f "${trivy_cache}/db/metadata.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "java_db_present=$([ -f "${trivy_cache}/java-db/metadata.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ steps.paths.outputs.repo_root }}/evaluator/go.mod
        cache-dependency-path: ${{ steps.paths.outputs.repo_root }}/evaluator/go.sum

    - name: Build evaluator and Grype VEX adapter
      shell: bash
      working-directory: ${{ steps.paths.outputs.repo_root }}/evaluator
      run: |
        go build -o /tmp/image-pipeline-evaluate .
        go build -o /tmp/image-pipeline-grype-vex ./cmd/grype-vex
        sudo install -m 0755 /tmp/image-pipeline-evaluate /usr/local/bin/
        sudo install -m 0755 /tmp/image-pipeline-grype-vex /usr/local/bin/

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: v0.76.0
        cache: true

    - name: Restore Trivy vulnerability database
      id: trivy-db-cache
      if: ${{ steps.paths.outputs.db_present != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.trivy_cache }}/db
        key: trivy-vuln-db-${{ runner.os }}-${{ steps.paths.outputs.cache_day }}
        restore-keys: |
          trivy-vuln-db-${{ runner.os }}-

    - name: Restore Trivy Java database
      id: trivy-java-db-cache
      if: ${{ steps.paths.outputs.java_db_present != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.trivy_cache }}/java-db
        key: trivy-java-db-${{ runner.os }}-${{ steps.paths.outputs.java_cache_period }}
        restore-keys: |
          trivy-java-db-${{ runner.os }}-

    - name: Read Trivy Java metadata
      id: trivy-java-metadata
      shell: bash
      env:
        TRIVY_CACHE: ${{ steps.paths.outputs.trivy_cache }}
      run: |
        metadata_hash=''
        if [ -f "${TRIVY_CACHE}/java-db/metadata.json" ]; then
          metadata_hash="$(sha256sum "${TRIVY_CACHE}/java-db/metadata.json" | cut -d ' ' -f 1)"
        fi
        echo "hash=${metadata_hash}" >> "$GITHUB_OUTPUT"

    - name: Restore Grype binary download
      id: grype-binary-cache
      if: ${{ inputs.with-grype == 'true' && steps.paths.outputs.grype_install_present != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.grype_install_cache }}
        key: grype-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.grype_version }}

    - name: Set up Grype
      if: ${{ inputs.with-grype == 'true' }}
      shell: bash
      env:
        GRYPE_VERSION: ${{ steps.paths.outputs.grype_version }}
        GRYPE_INSTALL_CACHE: ${{ steps.paths.outputs.grype_install_cache }}
        GRYPE_CHECK_FOR_APP_UPDATE: "false"
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "${ACTION_PATH}/install-grype.sh"

    - name: Save Grype binary download
      if: ${{ inputs.with-grype == 'true' && steps.paths.outputs.grype_install_present != 'true' && steps.grype-binary-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.grype_install_cache }}
        key: ${{ steps.grype-binary-cache.outputs.cache-primary-key }}

    - name: Restore Grype vulnerability database
      id: grype-db-cache
      if: ${{ inputs.with-grype == 'true' && steps.paths.outputs.grype_db_present != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.grype_cache }}
        key: grype-db-${{ runner.os }}-${{ steps.paths.outputs.grype_version }}-${{ steps.paths.outputs.cache_day }}
        restore-keys: |
          grype-db-${{ runner.os }}-${{ steps.paths.outputs.grype_version }}-

    - name: Configure and download VEX repos
      shell: bash
      env:
        REPO_ROOT: ${{ steps.paths.outputs.repo_root }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WITH_GRYPE: ${{ inputs.with-grype }}
      run: |
        set -euo pipefail

        mkdir -p ~/.trivy/vex reports
        cp "${REPO_ROOT}/vex/repository.yaml" ~/.trivy/vex/repository.yaml
        : > reports/grype-vex-documents.txt

        vex_unavailable() {
          echo "::error::$1"
          exit 1
        }

        if ! trivy vex repo download; then
          vex_unavailable "VEX repository download failed"
        fi

        vex_cache="${TRIVY_CACHE_DIR:-${HOME}/.cache/trivy}/vex/repositories"
        if [ "${INPUT_WITH_GRYPE}" = "true" ]; then
          if ! image-pipeline-grype-vex \
            --cache-dir "${vex_cache}" \
            --config ~/.trivy/vex/repository.yaml \
            --output-dir reports/grype-vex \
            --documents-list reports/grype-vex-documents.txt \
            --mode "${INPUT_MODE}"; then
            vex_unavailable "Indexed VEX documents could not be prepared for Grype"
          fi
        fi

    - name: Log in to source registry
      if: ${{ inputs.source_registry != '' }}
      shell: bash
      env:
        SOURCE_REGISTRY: ${{ inputs.source_registry }}
        SOURCE_REGISTRY_USER: ${{ inputs.source_registry_user }}
        SOURCE_REGISTRY_PASSWORD: ${{ inputs.source_registry_password }}
      run: |
        printf '%s' "${SOURCE_REGISTRY_PASSWORD}" | \
          docker login "${SOURCE_REGISTRY}" \
            --username "${SOURCE_REGISTRY_USER}" \
            --password-stdin

    - name: Trivy secrets scan
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        # Authenticate Trivy's GitHub API calls (VEX repo metadata,
        # advisory DB downloads). Unauthenticated requests share GHA
        # runner IP quotas and hit the 60/hr ceiling fast.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        mkdir -p reports
        for attempt in 1 2 3; do
          if trivy image \
            --scanners secret \
            --format json \
            --output reports/trivy-secrets.json \
            --exit-code 0 \
            "${INPUT_IMAGE}"; then
            break
          fi
          if [ "${attempt}" -eq 3 ]; then
            echo "::error::Trivy secrets scan failed after ${attempt} attempts"
            exit 1
          fi
          echo "::warning::Trivy secrets scan failed; retrying in 10s (attempt ${attempt}/3)"
          sleep 10
        done
        found=$(jq '[.Results[]?.Secrets // [] | .[]] | length' reports/trivy-secrets.json)
        if [ "$found" -gt 0 ]; then
          echo "::error::Trivy detected $found secret(s) in image - failing scan (no exception path for secrets)"
          jq '.Results[]?.Secrets // []' reports/trivy-secrets.json
          exit 1
        fi
        echo "No secrets detected in image."

    - name: Trivy vuln scan
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_SKIP_FILES: ${{ inputs.skip-files }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        skip_args=()
        while IFS= read -r path; do
          path="${path#"${path%%[![:space:]]*}"}"
          path="${path%"${path##*[![:space:]]}"}"
          [ -z "${path}" ] && continue
          skip_args+=(--skip-files "${path}")
        done <<< "${INPUT_SKIP_FILES}"

        for attempt in 1 2 3; do
          if trivy image \
            --scanners vuln \
            "${skip_args[@]}" \
            --format json \
            --output reports/trivy.json \
            --severity "${INPUT_SEVERITY}" \
            --vex repo \
            --skip-vex-repo-update \
            --exit-code 0 \
            "${INPUT_IMAGE}"; then
            break
          fi
          if [ "${attempt}" -eq 3 ]; then
            echo "::error::Trivy vulnerability scan failed after ${attempt} attempts"
            exit 1
          fi
          echo "::warning::Trivy vulnerability scan failed; retrying in 10s (attempt ${attempt}/3)"
          sleep 10
        done
        echo "::group::Trivy vuln report (table)"
        trivy convert --format table reports/trivy.json
        echo "::endgroup::"

    - name: Check Trivy databases
      id: trivy-databases
      shell: bash
      env:
        TRIVY_CACHE: ${{ steps.paths.outputs.trivy_cache }}
        JAVA_DB_HASH: ${{ steps.trivy-java-metadata.outputs.hash }}
      run: |
        echo "db_present=$([ -f "${TRIVY_CACHE}/db/metadata.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "java_db_present=$([ -f "${TRIVY_CACHE}/java-db/metadata.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        java_db_updated=false
        if [ -f "${TRIVY_CACHE}/java-db/metadata.json" ]; then
          metadata_hash="$(sha256sum "${TRIVY_CACHE}/java-db/metadata.json" | cut -d ' ' -f 1)"
          if [ "${metadata_hash}" != "${JAVA_DB_HASH}" ]; then
            java_db_updated=true
          fi
        fi
        echo "java_db_updated=${java_db_updated}" >> "$GITHUB_OUTPUT"

    - name: Save Trivy vulnerability database
      if: ${{ steps.paths.outputs.db_present != 'true' && steps.trivy-db-cache.outputs.cache-hit != 'true' && steps.trivy-databases.outputs.db_present == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.trivy_cache }}/db
        key: ${{ steps.trivy-db-cache.outputs.cache-primary-key }}

    - name: Save Trivy Java database
      if: ${{ steps.paths.outputs.java_db_present != 'true' && steps.trivy-java-db-cache.outputs.cache-hit != 'true' && steps.trivy-databases.outputs.java_db_present == 'true' && steps.trivy-databases.outputs.java_db_updated == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.trivy_cache }}/java-db
        key: ${{ steps.trivy-java-db-cache.outputs.cache-primary-key }}

    - name: Grype vuln scan
      if: ${{ inputs.with-grype == 'true' }}
      shell: bash
      env:
        GRYPE_DB_CACHE_DIR: ${{ steps.paths.outputs.grype_cache }}
        GRYPE_CHECK_FOR_APP_UPDATE: "false"
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SKIP_FILES: ${{ inputs.skip-files }}
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail

        vex_args=()
        while IFS= read -r doc; do
          if [ -n "${doc}" ]; then
            vex_args+=(--vex "${doc}")
          fi
        done < reports/grype-vex-documents.txt

        if [ "${#vex_args[@]}" -eq 0 ]; then
          echo "::error::No VEX documents were prepared for Grype"
          exit 1
        fi

        skip_args=()
        while IFS= read -r path; do
          path="${path#"${path%%[![:space:]]*}"}"
          path="${path%"${path##*[![:space:]]}"}"
          [ -z "${path}" ] && continue
          skip_args+=(--exclude "${path}")
        done <<< "${INPUT_SKIP_FILES}"

        echo "::group::Grype vuln report (table)"
        grype "${INPUT_IMAGE}" "${vex_args[@]}" "${skip_args[@]}" --by-cve --only-fixed -o table -o "json=reports/grype.json"
        echo "::endgroup::"

    - name: Save Grype vulnerability database
      if: ${{ inputs.with-grype == 'true' && steps.paths.outputs.grype_db_present != 'true' && steps.grype-db-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.grype_cache }}
        key: ${{ steps.grype-db-cache.outputs.cache-primary-key }}

    - name: Evaluate
      id: evaluate
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_EXCEPTIONS_PATH: ${{ inputs.exceptions-path }}
        SARIF_PATH: reports/image-pipeline.sarif
      run: |
        args=(
          --image "${INPUT_IMAGE}"
          --severity "${INPUT_SEVERITY}"
          --mode "${INPUT_MODE}"
          --trivy-json reports/trivy.json
          --sarif "${SARIF_PATH}"
        )
        if [ -n "${INPUT_EXCEPTIONS_PATH}" ]; then
          if [ ! -d "${INPUT_EXCEPTIONS_PATH}" ]; then
            echo "::error::exceptions-path '${INPUT_EXCEPTIONS_PATH}' does not exist or is not a directory"
            exit 1
          fi
          args+=(--exceptions "${INPUT_EXCEPTIONS_PATH}")
          echo "::notice::Using exceptions from '${INPUT_EXCEPTIONS_PATH}'"
        else
          echo "::notice::No exceptions-path provided; evaluating without local exceptions"
        fi
        if [ -f reports/grype.json ]; then
          args+=(--grype-json reports/grype.json)
        fi
        set +e
        image-pipeline-evaluate "${args[@]}"
        code=$?
        set -e
        echo "sarif-path=${SARIF_PATH}" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 0 ]; then
          echo "decision=passed" >> "$GITHUB_OUTPUT"
        else
          echo "decision=failed" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      with:
        sarif_file: ${{ steps.evaluate.outputs.sarif-path }}
        category: ${{ inputs.sarif-category }}

    - name: Gate result
      shell: bash
      env:
        EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
      run: exit "$EXIT_CODE"
