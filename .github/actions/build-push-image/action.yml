name: "build-push-image"
description: "Build and push a container image"

inputs:
  image:
    description: "Full image name, e.g. ghcr.io/myorg/app"
    required: true
  arch:
    description: "Single arch, e.g. amd64"
    required: false
    default: "amd64"
  docker-context:
    description: "Docker build context"
    required: false
    default: "."
  dockerfile:
    description: "Path to the Dockerfile"
    required: false
    default: "./Dockerfile"
  source_registry:
    description: "Optional source registry to docker login"
    required: false
    default: ""
  source_registry_user:
    description: "Username for source_registry login. Required when source_registry is set"
    required: false
    default: ""
  source_registry_password:
    description: "Password/token for source_registry login. Required when source_registry is set"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # we don't know if the action will run on a native runner or not so we setup qemu
    - name: Setup QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      with:
        image: tonistiigi/binfmt:qemu-v10.0.4
        cache-image: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    # This provides labels for the push phase.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ${{ inputs.image }}

    # we need to login before pushing if the repo is private
    - name: Login to source registry
      if: ${{ inputs.source_registry != '' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.source_registry }}
        username: ${{ inputs.source_registry_user }}
        password: ${{ inputs.source_registry_password }}

    - name: Push for ${{ inputs.arch }}
      id: push-image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.dockerfile }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/${{ inputs.arch }}
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ inputs.image }}
        # the tag of this image will be in this form `@sha256:<digest>`
        outputs: |
          type=image,push=true,push-by-digest=true,name-canonical=true

    # this digest can be used by other actions
    - name: Export digest
      shell: bash
      run: |
        mkdir -p ${{ runner.temp }}/digests
        echo "${STEPS_BUILD_IMAGE_OUTPUTS_DIGEST}" > "${{ runner.temp }}/digests/digest-${INPUTS_ARCH}.txt"
      env:
        STEPS_BUILD_IMAGE_OUTPUTS_DIGEST: ${{ steps.push-image.outputs.digest }}
        INPUTS_IMAGE: ${{ inputs.image }}
        INPUTS_ARCH: ${{ inputs.arch }}

    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digest-${{ inputs.arch }}
        path: ${{ runner.temp }}/digests/*.txt
        retention-days: 1
