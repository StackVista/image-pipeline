name: Action unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/scan-image/**"
      - "evaluator/**"
      - "vex/**"
      - "schemas/**"
      - ".github/workflows/action-ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/scan-image/**"
      - "evaluator/**"
      - "vex/**"
      - "schemas/**"
      - ".github/workflows/action-ci.yml"

permissions:
  contents: read

concurrency:
  group: action-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-smoke:
    name: action-smoke (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: local-clean
            image: image-pipeline-action-test:latest
            build_local: true
            expected_decision: passed
          # SLES 15 SP3 base, digest-pinned so the CVE surface is frozen.
          # Reliably yields HIGH/CRITICAL findings (verified 2026-05-18: 36 HIGH, 3 CRITICAL).
          - name: known-vuln
            image: registry.suse.com/bci/bci-base:15.3@sha256:906ade16ed715fc25a4eb72afcabc51330b9c4f549bb48d752ca64369ba1e227
            build_local: false
            expected_decision: failed
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build local test image
        if: ${{ matrix.case.build_local }}
        run: |
          docker build \
            --tag image-pipeline-action-test:latest \
            .github/actions/scan-image/testdata/clean

      - name: Run scan
        id: scan
        uses: ./.github/actions/scan-image
        continue-on-error: ${{ matrix.case.expected_decision == 'failed' }}
        with:
          image: ${{ matrix.case.image }}
          with-grype: "true"
          upload-sarif: "false"

      - name: Assert outputs
        env:
          DECISION: ${{ steps.scan.outputs.decision }}
          EXPECTED_DECISION: ${{ matrix.case.expected_decision }}
          SARIF_PATH: ${{ steps.scan.outputs.sarif-path }}
        run: |
          test "${DECISION}" = "${EXPECTED_DECISION}"
          test "${SARIF_PATH}" = "reports/image-pipeline.sarif"
          test -f reports/image-pipeline.sarif
