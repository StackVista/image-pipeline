name: Action unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/scan-image/**"
      - ".github/actions/scan-sign-push/**"
      - "evaluator/**"
      - "vex/**"
      - "schemas/**"
      - ".github/workflows/action-ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/scan-image/**"
      - ".github/actions/scan-sign-push/**"
      - "evaluator/**"
      - "vex/**"
      - "schemas/**"
      - ".github/workflows/action-ci.yml"

permissions:
  contents: read

concurrency:
  group: action-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-smoke:
    # End-to-end scan coverage for the composite action. Every PR touching the
    # action, evaluator, VEX config, schemas, or this workflow scans both a clean
    # local image and a digest-pinned vulnerable BCI image.
    name: action-smoke (${{ matrix.case.name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        case:
          - name: local-clean
            image: image-pipeline-action-test:latest
            build_local: true
            mode: gate
            expected_decision: passed
          # SLES 15 SP3 base, digest-pinned so the CVE surface is frozen.
          # Reliably yields HIGH/CRITICAL findings (verified 2026-05-18: 36 HIGH, 3 CRITICAL).
          - name: known-vuln
            image: registry.suse.com/bci/bci-base:15.3@sha256:906ade16ed715fc25a4eb72afcabc51330b9c4f549bb48d752ca64369ba1e227
            build_local: false
            mode: gate
            expected_decision: failed
          # Real published SUSE Observability image. This canary keeps the
          # shared action honest against consumer image formats, while inform
          # mode avoids coupling the test to the image's current CVE surface.
          - name: published-stackgraph-console
            image: registry.rancher.com/suse-observability/stackgraph-console:2.5-8.1.2@sha256:c00103decfff25d3ac187d4d0f84ab8068b15306d8fcb613c98507e4ec867085
            build_local: false
            mode: inform
            expected_decision: passed
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build local test image
        if: ${{ matrix.case.build_local }}
        run: |
          docker build \
            --tag image-pipeline-action-test:latest \
            .github/actions/scan-image/testdata/clean

      - name: Run scan
        id: scan
        uses: ./.github/actions/scan-image
        continue-on-error: ${{ matrix.case.expected_decision == 'failed' }}
        with:
          image: ${{ matrix.case.image }}
          mode: ${{ matrix.case.mode }}
          with-grype: "true"
          upload-sarif: "false"

      - name: Assert outputs
        env:
          DECISION: ${{ steps.scan.outputs.decision }}
          EXPECTED_DECISION: ${{ matrix.case.expected_decision }}
          SARIF_PATH: ${{ steps.scan.outputs.sarif-path }}
        run: |
          test "${DECISION}" = "${EXPECTED_DECISION}"
          test "${SARIF_PATH}" = "reports/image-pipeline.sarif"
          test -f reports/image-pipeline.sarif

  scan-sign-push-smoke:
    # End-to-end coverage for scan-sign-push: build two per-arch tarballs, run the
    # action against a local registry:2, and confirm it scans, assembles a
    # multi-arch manifest under every tag, keyless-signs the assembled digest, and
    # verifies it. Keyless signing uses public Fulcio/Rekor with the workflow's
    # OIDC token; the signature is stored in the local registry.
    name: scan-sign-push-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: network=host

      - name: Build per-arch tarballs
        run: |
          set -euo pipefail
          ctx="$(mktemp -d)"
          printf 'FROM scratch\nCOPY hello.txt /hello.txt\n' > "$ctx/Dockerfile"
          echo hello > "$ctx/hello.txt"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" \
              --output "type=docker,dest=image-${arch}.tar" "$ctx"
          done

      - name: scan-sign-push
        uses: ./.github/actions/scan-sign-push
        with:
          image: localhost:5000/smoke/scan-sign-push
          tags: |
            v0
            latest
          arches: amd64,arm64
          source-mode: tarball
          tarball-dir: .
          with-grype: "false"
          upload-sarif: "false"
          target-registry: localhost:5000

      - name: Assert both tags resolve to one signed multi-arch digest
        run: |
          set -euo pipefail
          d0=$(docker buildx imagetools inspect localhost:5000/smoke/scan-sign-push:v0 --format '{{.Manifest.Digest}}')
          d1=$(docker buildx imagetools inspect localhost:5000/smoke/scan-sign-push:latest --format '{{.Manifest.Digest}}')
          test "$d0" = "$d1"
          # Two child manifests (amd64, arm64) in the list.
          n=$(docker buildx imagetools inspect "localhost:5000/smoke/scan-sign-push@${d0}" --raw | jq '.manifests | length')
          test "$n" -eq 2
