name: Native ARM scanner policy pairs

on:
  pull_request:
    branches: [main, scanner-runtime-yaml]
    paths:
      - 'docs/scanner-runtime-arm/native/**'
      - '.github/workflows/scanner-arm-policy.yml'

permissions: {}

concurrency:
  group: scanner-arm-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Native ARM secret, vulnerability and error controls (${{ matrix.family }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        family: [newer, older]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Native original and candidate frozen policy pair
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_OUTPUT: ${{ runner.temp }}/arm-policy-${{ matrix.family }}
          ARM_FAMILY: ${{ matrix.family }}
          ARM_SNAPSHOT_RECEIPTS: ${{ github.workspace }}/docs/scanner-runtime-arm/native/snapshot-receipts.json
        run: |
          python3 -m venv "$RUNNER_TEMP/arm-python"
          "$RUNNER_TEMP/arm-python/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/arm-python/bin/python" docs/scanner-runtime-arm/native/run.py "$ARM_FAMILY"
      - name: Package actual complete or partial evidence
        if: always()
        env:
          ARM_OUTPUT: ${{ runner.temp }}/arm-policy-${{ matrix.family }}
        run: python3 docs/scanner-runtime-arm/native/package.py "$ARM_OUTPUT"
      - name: Retain raw policy reports and complete new frozen snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-policy-${{ matrix.family }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/arm-policy-${{ matrix.family }}/*.json
            ${{ runner.temp }}/arm-policy-${{ matrix.family }}/raw-reports.tar.gz
            ${{ runner.temp }}/arm-policy-${{ matrix.family }}/setup/
            ${{ runner.temp }}/arm-policy-${{ matrix.family }}/new-frozen-inputs.tar.gz
          if-no-files-found: error
          retention-days: 14
