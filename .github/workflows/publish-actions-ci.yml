name: Publish action unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/push-single-arch/**"
      - ".github/actions/merge-multiarch/**"
      - ".github/actions/shared/**"
      - ".github/workflows/publish-actions-ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/push-single-arch/**"
      - ".github/actions/merge-multiarch/**"
      - ".github/actions/shared/**"
      - ".github/workflows/publish-actions-ci.yml"

permissions:
  contents: read

concurrency:
  group: publish-actions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-tag-check:
    name: Registry tag helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run registry tag helper tests
        run: bash .github/actions/shared/registry-tag-check.test.sh
