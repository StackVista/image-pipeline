name: Publication recovery tests

on:
  pull_request:
    paths:
      - '.github/actions/merge-multiarch/**'
      - '.github/actions/push-single-arch/**'
      - '.github/workflows/publication-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/merge-multiarch/**'
      - '.github/actions/push-single-arch/**'
      - '.github/workflows/publication-tests.yml'

permissions: {}

jobs:
  recovery:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify interrupted publication recovery
        run: python3 -m unittest discover -s .github/actions/merge-multiarch/tests -v

  registry-recovery:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.36.1
          driver-opts: network=host
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resume real registry publication and keyless signing
        env:
          PUBLICATION_TEST_REGISTRY: localhost:5000
        run: python3 -m unittest discover -s .github/actions/merge-multiarch/tests -p test_registry.py -v
