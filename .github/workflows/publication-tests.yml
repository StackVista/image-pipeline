name: Publication recovery tests

on:
  pull_request:
    paths:
      - '.github/actions/merge-multiarch/**'
      - '.github/actions/push-single-arch/**'
      - '.github/workflows/publication-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/merge-multiarch/**'
      - '.github/actions/push-single-arch/**'
      - '.github/workflows/publication-tests.yml'

permissions: {}

jobs:
  recovery:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify interrupted publication recovery
        run: python3 -m unittest discover -s .github/actions/merge-multiarch/tests -v

  registry-recovery:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Start disposable SUSE BCI registry
        run: |
          docker run -d --rm --name publication-test-registry -p 5000:5000 \
            -v "$PWD/.github/actions/merge-multiarch/tests/registry.yml:/etc/registry/config.yml:ro" \
            registry.suse.com/suse/registry:3.1@sha256:dc9bcb55b56a5f0342c336a1881de659bfe8240c1854c37dde3b0c8bd3ffb6af
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://localhost:5000/v2/
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.36.1
          driver-opts: network=host
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resume real registry publication and keyless signing
        env:
          PUBLICATION_TEST_REGISTRY: localhost:5000
        run: python3 -m unittest discover -s .github/actions/merge-multiarch/tests -p test_registry.py -v
      - name: Remove test registry
        if: ${{ always() }}
        run: docker rm -fv publication-test-registry
