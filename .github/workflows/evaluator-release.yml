name: Evaluator Release

# Tag-driven release of the image-pipeline-evaluate Go binary (see
# ../../evaluator). Triggered by pushing a v* SemVer tag — goreleaser
# builds linux/darwin × amd64/arm64 archives + checksums and publishes
# a GitHub Release. See README.md for the tagging scheme.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: evaluator-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: evaluator/go.mod
          cache-dependency-path: evaluator/go.sum
          cache: false

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
