name: Older scanner runtime source qualification

on:
  pull_request:
    branches: [scanner-runtime-yaml]
    paths:
      - 'scanner-runtime/**'
      - '.github/workflows/older-scanner-runtime-ci.yml'
      - '.github/workflows/lint-workflows.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: older-scanner-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native older scanner build and owner contracts (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SCANNER_FAMILY: older
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify complete source attribution and signed BCI builder
        run: |
          python3 scanner-runtime/scripts/inventory.py
          sha256sum -c <<'SUM'
          98b312e62e3e8dce75ae06d2be7277732bee4f7ad275e9de9cd1071d6fcb2329  scanner-runtime/provenance/suse-container-key.pem
          SUM
          cosign verify --key scanner-runtime/provenance/suse-container-key.pem \
            registry.suse.com/bci/golang@sha256:97e1dd2838dba67fff33d75d30ac52b048191d385f8fef4be1e147890302dd51
      - name: Build native scanners and verify effective parser graphs and symbols
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p scanner-runtime/out "$RUNNER_TEMP/scanner-go" "$RUNNER_TEMP/scanner-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SCANNER_FAMILY -e EXPECTED_ARCH -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/tmp/go-cache \
            -v "$PWD:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/scanner-go:/tmp/go" -v "$RUNNER_TEMP/scanner-cache:/tmp/go-cache" \
            --name scanner-runtime-builder \
            registry.suse.com/bci/golang@sha256:97e1dd2838dba67fff33d75d30ac52b048191d385f8fef4be1e147890302dd51 \
            bash scanner-runtime/scripts/build.sh
      - name: Run native YAML and owning caller contracts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SCANNER_FAMILY -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/tmp/go-cache \
            -v "$PWD:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/scanner-go:/tmp/go" -v "$RUNNER_TEMP/scanner-cache:/tmp/go-cache" \
            registry.suse.com/bci/golang@sha256:97e1dd2838dba67fff33d75d30ac52b048191d385f8fef4be1e147890302dd51 \
            bash scanner-runtime/scripts/contracts.sh
      - name: Package exact candidate binaries and provenance
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: python3 scanner-runtime/scripts/package.py "$CANDIDATE_ARCH"
      - name: Retain isolated candidate archives and qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: older-scanner-runtime-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.arch }}
          path: scanner-runtime/out/older/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign qualified candidate checksum and provenance manifests
    needs: native
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: older-scanner-runtime-*
          path: candidates
      - name: Sign candidate manifests using GitHub OIDC
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            cosign sign-blob --yes --bundle "${manifest}.sigstore.json" "$manifest"
          done < <(find candidates -type f \( -name SHA256SUMS -o -name provenance.json \) -print0)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: older-scanner-runtime-signed-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidates/
          if-no-files-found: error
          retention-days: 14
